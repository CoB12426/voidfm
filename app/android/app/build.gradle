plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: app/android/key.properties locally, VOIDFM_* env vars in CI.
// Falls back to the debug key when neither is available.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { keystoreProperties.load(it) }
}
def releaseStoreFile = keystoreProperties["storeFile"] ?: System.getenv("VOIDFM_KEYSTORE_PATH")

android {
    namespace "io.github.cob12426.voidfm"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "io.github.cob12426.voidfm"
        minSdk 26
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile file(releaseStoreFile)
                storePassword keystoreProperties["storePassword"] ?: System.getenv("VOIDFM_KEYSTORE_PASSWORD")
                keyAlias keystoreProperties["keyAlias"] ?: System.getenv("VOIDFM_KEY_ALIAS")
                keyPassword keystoreProperties["keyPassword"] ?: System.getenv("VOIDFM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig releaseStoreFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.17.1"
    implementation "org.apache.commons:commons-compress:1.27.1"
}
